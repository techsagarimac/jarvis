<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jarvis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      background: #000;
      color: #ffd0d0;
      font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      pointer-events: none;
      text-align: center;
      padding: 0.6rem max(clamp(0.9rem, 4vw, 1.6rem), env(safe-area-inset-right, 0px)) calc(0.7rem + env(safe-area-inset-bottom, 0px)) max(clamp(0.9rem, 4vw, 1.6rem), env(safe-area-inset-left, 0px));
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78) 40%, rgba(0, 0, 0, 0));
    }

    .name {
      letter-spacing: 0.46em;
      font-size: clamp(0.68rem, 2.2vw, 0.86rem);
      font-weight: 650;
      color: #ffecec;
      text-shadow: 0 0 16px rgba(255, 40, 40, 0.7);
      padding-left: 0.46em;
    }

    .status {
      margin-top: 0.4rem;
      font-size: clamp(0.8rem, 2.6vw, 0.95rem);
      color: #c47a7a;
      min-height: 1.2em;
    }

    .heard, .reply {
      max-width: min(36rem, 100%);
      margin: 0.3rem auto 0;
      font-size: clamp(0.86rem, 2.8vw, 1.05rem);
      line-height: 1.4;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .heard { color: rgba(255, 200, 200, 0.55); }
    .reply { color: #ffd6d6; }

    @media (max-width: 480px) {
      .heard, .reply { -webkit-line-clamp: 4; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .hud {
        padding-top: 0.35rem;
        padding-bottom: calc(0.35rem + env(safe-area-inset-bottom, 0px));
      }
      .status { margin-top: 0.2rem; }
      .heard, .reply {
        -webkit-line-clamp: 2;
        font-size: clamp(0.78rem, 2.2vh, 0.92rem);
      }
    }
  </style>
</head>
<body class="listening">
  <canvas id="field"></canvas>
  <div class="hud">
    <div class="name">JARVIS</div>
    <div class="status" id="status">Say hey Jarvis</div>
    <p class="heard" id="heard"></p>
    <p class="reply" id="reply"></p>
  </div>
  <script>
    const captions = {
      idle: "Stand by",
      listening: "Say hey Jarvis",
      recording: "Listening…",
      thinking: "Thinking…",
      speaking: "Speaking…",
    };

    const canvas = document.getElementById("field");
    const hud = document.querySelector(".hud");
    const ctx = canvas.getContext("2d", { alpha: false });
    let mode = "listening";
    let w = 0, h = 0, cx = 0, cy = 0, dpr = 1, orbR = 120;
    let yaw = 0, pitch = 0.18;
    const particles = [];
    let lastDensity = -1;

    function rand() { return Math.random(); }

    function densityForSize() {
      const s = Math.min(w, h);
      if (s < 420) return 0.42;
      if (s < 700) return 0.7;
      return 1;
    }

    function onSphere(radius) {
      const u = rand();
      const v = rand();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const s = Math.sin(phi);
      return {
        x: radius * s * Math.cos(theta),
        y: radius * s * Math.sin(theta),
        z: radius * Math.cos(phi),
      };
    }

    function build(density) {
      particles.length = 0;
      const d = density;

      for (let i = 0; i < Math.round(1750 * d); i++) {
        const p = onSphere(Math.pow(rand(), 0.4) * 0.4);
        const hot = rand();
        particles.push({
          ...p,
          glow: 3.8,
          size: 0.5 + rand() * 1.2,
          tw: rand() * Math.PI * 2,
          r: 255,
          g: 10 + hot * 28,
          b: 8,
          hr: 255,
          hg: 46 + hot * 36,
          hb: 32,
        });
      }

      for (let i = 0; i < Math.round(380 * d); i++) {
        const p = onSphere(0.4 + Math.pow(rand(), 0.75) * 0.38);
        particles.push({
          ...p,
          glow: 2.6,
          size: 0.4 + rand() * 0.9,
          tw: rand() * Math.PI * 2,
          r: 230,
          g: 8,
          b: 6,
          hr: 255,
          hg: 36,
          hb: 24,
        });
      }

      const n = Math.max(180, Math.round(820 * d));
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < n; i++) {
        const y = 1 - (i / Math.max(1, n - 1)) * 2;
        const rxy = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = golden * i;
        const jitter = 0.97 + rand() * 0.06;
        particles.push({
          x: Math.cos(theta) * rxy * jitter,
          y: y * jitter,
          z: Math.sin(theta) * rxy * jitter,
          glow: 1.8,
          size: 0.32 + rand() * 0.7,
          tw: rand() * Math.PI * 2,
          r: 200,
          g: 6,
          b: 4,
          hr: 255,
          hg: 40,
          hb: 28,
        });
      }
    }

    function viewport() {
      const vv = window.visualViewport;
      return {
        w: Math.max(1, Math.round(vv ? vv.width : window.innerWidth)),
        h: Math.max(1, Math.round(vv ? vv.height : window.innerHeight)),
      };
    }

    function layout() {
      const hudH = hud.getBoundingClientRect().height;
      const topPad = Math.max(10, Math.min(h * 0.06, 48));
      const gap = Math.max(8, Math.min(h * 0.02, 18));
      const availH = Math.max(72, h - hudH - topPad - gap);
      cx = w / 2;
      cy = topPad + availH / 2;
      const cap = Math.min(w, h, 920);
      orbR = Math.min(w * 0.44, availH * 0.46, cap * 0.36);
      orbR = Math.max(orbR, Math.min(64, cap * 0.22));
    }

    function resize() {
      const vp = viewport();
      w = vp.w;
      h = vp.h;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layout();
      const density = densityForSize();
      if (density !== lastDensity) {
        lastDensity = density;
        build(density);
      }
    }

    function speedMul() {
      if (mode === "speaking") return 2.4;
      if (mode === "recording") return 1.7;
      if (mode === "thinking") return 1.25;
      return 1;
    }

    function frame(now) {
      const mul = speedMul();
      yaw += 0.0042 * mul;
      pitch = 0.16 + 0.05 * Math.sin(now * 0.00035);
      const pulse = mode === "speaking" ? 1 + 0.045 * Math.sin(now * 0.008) : 1;
      const breath = 1 + 0.012 * Math.sin(now * 0.0011);
      const radius = orbR * pulse * breath;
      const cam = 2.35;
      const focal = radius * 1.55;
      const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const sizeBase = Math.max(0.72, radius / 200);
      const drawGlow = w >= 480 && h >= 480;

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      const haze = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius * 1.15);
      haze.addColorStop(0, `rgba(90, 0, 0, ${mode === "speaking" ? 0.22 : 0.12})`);
      haze.addColorStop(0.35, "rgba(50, 0, 0, 0.06)");
      haze.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "lighter";

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        let x = p.x * cyaw - p.z * syaw;
        let z = p.x * syaw + p.z * cyaw;
        const y = p.y * cp - z * sp;
        z = p.y * sp + z * cp;

        const depth = 1 / (z + cam);
        const sx = cx + x * focal * depth;
        const sy = cy + y * focal * depth;
        const front = (z + 1) * 0.5;
        const twinkle = 0.72 + 0.28 * Math.sin(now * 0.0032 + p.tw);
        const a = (0.22 + 0.78 * (0.35 + 0.65 * front)) * twinkle;
        const size = p.size * (0.55 + 0.9 * front) * sizeBase;

        if (drawGlow) {
          ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a * 0.14})`;
          ctx.beginPath();
          ctx.arc(sx, sy, size * p.glow, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = `rgba(${p.hr},${p.hg},${p.hb},${Math.min(1, a * 0.95)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(0.45, size), 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 80));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resize);
    }
    new ResizeObserver(resize).observe(hud);

    resize();
    requestAnimationFrame(frame);

    async function tick() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        mode = data.mode || "listening";
        document.body.className = mode;
        document.getElementById("status").textContent = captions[mode] || mode;
        document.getElementById("heard").textContent = data.heard ? "You: " + data.heard : "";
        document.getElementById("reply").textContent = data.reply || "";
      } catch (_) {}
    }

    tick();
    setInterval(tick, 90);
  </script>
</body>
</html>
